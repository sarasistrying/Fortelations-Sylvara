  <style>
    /* ============================================================
       BACKGROUND FIX
       The hero's animated background image was scoped only to
       #hero, so it scrolled away before reaching #competitions (or
       anything else below the fold). Making it position:fixed lets
       it sit behind the entire page instead.
       ============================================================ */
    .parallaxbackground {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      pointer-events: none;
    }

    /* ============================================================
       .gedungbg ON MOBILE ONLY
       Per your request: left.webp/right.webp and .resplendent are
       left completely alone, exactly as style.css already has
       them. Only .gedungbg (Hero Page Animation.webp, the center
       pond/rocks scene) gets a mobile-only fix here.

       Hero_Page_Animation.webp is a 3840x2160 canvas where the
       real art is a wide, short strip (2663x627px) near the
       bottom-center -- most of the canvas is transparent. Without
       this, the desktop-only fixed 1920x1080px rule from
       style.css just keeps that same huge canvas size on mobile
       too (since style.css's own mobile override never touches
       .gedungbg), so on a narrow screen either very little of the
       real artwork is visible or it overflows oddly. This rule
       only applies at the mobile breakpoint -- desktop is
       completely unaffected and still uses style.css's own rule.
       ============================================================ */
    @media (max-width: 768px) {
      .gedungbg {
        position: absolute !important;
        bottom: 0 !important;
        left: 50% !important;
        right: auto !important;
        transform: translateX(-50%) !important;
        height: 18vh !important;
        max-height: 220px !important;
        aspect-ratio: 2663 / 627 !important;
        width: auto !important;
        max-width: 95vw !important;
        object-fit: cover !important;
        object-position: 50% 100% !important;
      }
    }

    /* ============================================================
       COMPETITIONS — IRREGULAR ROCK SCATTER
       Fresh approach: rocks are placed at fixed percentage
       coordinates within a fixed-height scatter area, so the
       composition is identical on every screen size — it just
       scales rather than reflowing. No scroll-driven movement;
       position is the whole point here.
       ============================================================ */

    .competitions-section {
      position: relative;
      z-index: 2;
      width: 100%;
      padding-bottom: 160px;
    }

    .competitions-heading {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 100px 20px 60px;
    }

    .competitions-heading h2 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: clamp(28px, 5vw, 48px);
      color: #FCDD8B;
      text-shadow: 0 0 12px #B8BE49, 0 0 30px rgba(239, 157, 109, 0.35);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin: 0 0 8px;
    }

    /* ============================================================
       CUSTOM IMAGE HEADINGS (Competition.png / Countdown.png)
       These PNGs have large transparent canvas areas above and
       below the actual text (content is only ~21-27% of canvas
       height). Negative vertical margins pull out that dead space
       so the headings don't create a large visual gap. Adjust
       the margin values if the canvas proportions change.
       ============================================================ */
    .section-heading-img {
      display: block;
      width: min(80vw, 820px) !important;
      max-width: none !important;
      height: auto !important;
      margin: -12% auto -12%;
      filter:
        drop-shadow(0 8px 24px rgba(0, 0, 0, 0.75))
        drop-shadow(0 2px 8px rgba(0, 0, 0, 0.9))
        drop-shadow(0 0 12px rgba(239, 157, 109, 0.4));
      animation: logo-float 3s ease-in-out infinite;
    }

    .competitions-heading p {
      font-family: 'Open Sans', sans-serif;
      font-size: clamp(13px, 1.6vw, 16px);
      color: rgba(255, 255, 255, 0.7);
      margin: 0;
    }

    .competitions-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      z-index: -1;
      pointer-events: none;
    }

    /* ============================================================
       ROCK SCATTER
       Each rock is placed at a percentage position (left/top) so
       its spot in the composition stays identical on every screen
       size — the whole arrangement just scales up or down rather
       than reflowing. Size is also percentage/viewport based for
       the same reason. "z" is simulated via z-index + a subtle
       scale/blur so rocks read as nearer or farther without
       actually needing 3D.
       ============================================================ */

    .rock-scatter {
      position: relative;
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
      height: 420vh;
      z-index: 1;
    }

    .rock {
      position: absolute !important;
      width: 18% !important;
      height: auto !important;
      aspect-ratio: 1 / 1 !important;
      cursor: pointer !important;
      display: block !important;
      border: none !important;
      outline: none !important;
      background: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      font-size: 0 !important;
      appearance: none !important;
      -webkit-appearance: none !important;
      -webkit-tap-highlight-color: transparent;
      will-change: transform;
      transform: translate(-50%, -50%) scale(var(--depth-scale, 1)) !important;
      transition: transform 0.3s ease, box-shadow 0.3s ease !important;
    }

    .rock:hover,
    .rock:focus-visible {
      transform: translate(-50%, -50%) scale(calc(var(--depth-scale, 1) * 1.08)) !important;
      box-shadow: none !important;
    }

    .rock:active {
      transform: translate(-50%, -50%) scale(calc(var(--depth-scale, 1) * 1.08)) !important;
      box-shadow: none !important;
      outline: none !important;
    }

    .rock img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.55));
      transition: filter 0.3s ease;
    }

    .rock:hover img,
    .rock:focus-visible img {
      filter: drop-shadow(0 0 14px rgba(184, 190, 73, 0.65)) drop-shadow(0 4px 6px rgba(0, 0, 0, 0.6));
    }

    .rock-label {
      position: absolute;
      left: 50%;
      bottom: -6%;
      transform: translate(-50%, 0);
      width: 92%;
      text-align: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: clamp(9px, 1.1vw, 12px);
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: #FCDD8B;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.85), 0 0 10px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      line-height: 1.2;
    }

    .rock:hover .rock-label,
    .rock:focus-visible .rock-label {
      opacity: 1;
    }

    /* ============================================================
       HOVER DETAIL TOOLTIP
       Each rock carries its own tooltip, anchored directly to it
       rather than a shared full-screen modal. It opens toward the
       center of the path: rocks on the left side of the screen
       open their tooltip to the right, rocks on the right side
       open theirs to the left — so the card never runs off-screen
       and always reads "inward" from the stone.
       ============================================================ */

    .rock-tooltip {
      position: absolute;
      top: 50%;
      width: clamp(130px, 16vw, 220px);
      background: rgba(20, 26, 16, 0.94);
      border: 2px solid rgba(184, 190, 73, 0.45);
      border-radius: 16px;
      padding: 14px 16px 16px;
      text-align: left;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 50;
    }

    /* anchored to a left-side rock: tooltip opens to the right */
    .rock-tooltip.side-right {
      left: 100%;
      margin-left: 10px;
      transform: translateY(-50%) translateX(-8px);
    }

    /* anchored to a right-side rock: tooltip opens to the left */
    .rock-tooltip.side-left {
      right: 100%;
      margin-right: 10px;
      transform: translateY(-50%) translateX(8px);
    }

    .rock:hover .rock-tooltip,
    .rock:focus-visible .rock-tooltip {
      opacity: 1;
      pointer-events: auto;
    }

    .rock:hover .rock-tooltip.side-right,
    .rock:focus-visible .rock-tooltip.side-right {
      transform: translateY(-50%) translateX(0);
    }

    .rock:hover .rock-tooltip.side-left,
    .rock:focus-visible .rock-tooltip.side-left {
      transform: translateY(-50%) translateX(0);
    }

    .rock-tooltip h3 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: clamp(14px, 1.6vw, 17px);
      color: #FCDD8B;
      text-shadow: 0 0 10px #B8BE49;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin: 0 0 6px;
    }

    .rock-tooltip p {
      font-family: 'Open Sans', sans-serif;
      color: rgba(255, 255, 255, 0.82);
      font-size: clamp(11px, 1.2vw, 13px);
      line-height: 1.5;
      margin: 0;
    }

    /* On touch/small screens, side-flipped tooltips risk running off
       the opposite edge since rocks already sit close to the inset
       boundary there — center them under the rock instead */
    @media (max-width: 700px) {
      .rock-tooltip,
      .rock-tooltip.side-left,
      .rock-tooltip.side-right {
        left: 50%;
        right: auto;
        top: 100%;
        margin: 12px 0 0;
        transform: translateX(-50%) translateY(-6px);
        width: clamp(160px, 60vw, 220px);
      }

      .rock:hover .rock-tooltip,
      .rock:focus-visible .rock-tooltip {
        transform: translateX(-50%) translateY(0);
      }
    }
    /* ============================================================

<script>

    // Scroll animation from hero to countdown
    
    const resplendentLogo = document.querySelector('.resplendent');

    // Add CSS animations
    const style = document.createElement('style');
    style.textContent = `
      @keyframes glow-pulse {
        0%, 100% {
          text-shadow: 0 0 10px #B8BE49, 0 0 20px #B8BE49, 0 0 30px #EF9D6D, 0 0 40px #EF9D6D;
        }
        50% {
          text-shadow: 0 0 20px #B8BE49, 0 0 30px #B8BE49, 0 0 40px #EF9D6D, 0 0 50px #EF9D6D;
        }
      }
      
      @keyframes logo-float {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.02);
        }
      }
      
      @keyframes pulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }
      
      .countdown-box:hover {
        background: rgba(239, 157, 109, 0.25) !important;
        box-shadow: 0 0 30px rgba(239, 157, 109, 0.5), inset 0 0 30px rgba(239, 157, 109, 0.2) !important;
        transform: translateY(-5px);
      }

      @media (min-width: 769px) and (max-width: 1010px) {
        /* In this range, the digits got too wide for 4-across at
           minmax(220px,...) but the page is wider than the mobile
           breakpoint -- auto-fit would otherwise settle into an
           awkward 3-column wrap. Force a clean 2x2 grid instead,
           sized a bit larger than the phone version since there's
           more room to work with. */
        .countdown-timer {
          grid-template-columns: repeat(2, 1fr) !important;
          gap: clamp(24px, 3vw, 36px) !important;
          max-width: 640px !important;
        }

        .countdown-digit {
          height: clamp(60px, 8vw, 80px) !important;
        }
      }

      @media (max-width: 768px) {
        .countdown-title {
          font-size: clamp(28px, 7vw, 42px) !important;
          margin-bottom: 24px !important;
        }
        
        .countdown-subtitle {
          font-size: clamp(16px, 4vw, 24px) !important;
          margin-bottom: 24px !important;
        }
        
        .countdown-timer {
          grid-template-columns: repeat(2, 1fr) !important;
          gap: clamp(14px, 3vw, 28px) !important;
          max-width: 100% !important;
          padding: 0 10px;
        }
        
        .countdown-box {
          padding: clamp(20px, 5vw, 32px) clamp(16px, 3vw, 24px) !important;
        }
        
        .countdown-number {
          font-size: clamp(40px, 12vw, 60px) !important;
        }

        .countdown-digit {
          height: clamp(40px, 12vw, 60px) !important;
        }
        
        .countdown-message {
          font-size: clamp(14px, 4vw, 18px) !important;
        }
      }

      @media (max-width: 480px) {
        .countdown-section {
          padding: 60px 12px 30px !important;
        }
      }
    `;
    document.head.appendChild(style);

    const lenis = new Lenis({ lerp: 0.15, wheelMultiplier: 1.82 })
    window.lenis = lenis

  const setGedungLeft = gsap.quickSetter(".gedungleft", "x", "px");
  const setGedungRight = gsap.quickSetter(".gedungright", "x", "px");
  const setResplendent = gsap.quickSetter(".resplendent", "y", "px");

  lenis.on('scroll', (e) => {
    ScrollTrigger.update()
    const y = window.scrollY;
    setGedungLeft(-y * 0.3);
    setGedungRight(y * 0.3);
    setResplendent(y * 0.2);
  })

  gsap.ticker.add((time)=>{
    lenis.raf(time * 1000)
  })

  let countdownLock = 0;
  let lockThrottle = false;
  let aboutTopY = 0;
  let isLocking = false;
  const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  if (!isTouchDevice) {
    lenis.on('scroll', (e) => {
      const about = document.querySelector('#about');
      if (!about) return;
      const rect = about.getBoundingClientRect();
      if (rect.top <= 0 && rect.bottom > 0 && e.direction > 0) {
        if (countdownLock < 3) {
          if (!isLocking) {
            isLocking = true;
            aboutTopY = window.scrollY + rect.top;
          }
          if (!lockThrottle) {
            lockThrottle = true;
            countdownLock++;
            setTimeout(() => lockThrottle = false, 400);
          }
          if (window.scrollY > aboutTopY + 1) {
            lenis.scrollTo(aboutTopY, { immediate: true });
          }
        } else {
          isLocking = false;
        }
      } else {
        countdownLock = 0;
        isLocking = false;
      }
    });
  }

const splitTypes = document.querySelectorAll('.subtheme');

splitTypes.forEach((char, i) => {
  const text = new SplitType(char, { types: 'chars' });

  gsap.from(text.chars, {
    scrollTrigger: {
      trigger: char,
      start: 'top 90%',
      end: 'top 20%',
      scrub: false,
      toggleActions: 'play none none reverse', // Play on scroll down, reverse on scroll up
    },
    opacity: 0.2,
    stagger: 0.075,
  });
});


  const splitTypess = document.querySelectorAll('.whatisforte')

  splitTypess.forEach((char,i) => {
    const text = new SplitType(char, {types: 'chars, words'})

    gsap.from(text.chars, {
      scrollTrigger: {
        trigger: char,
        start: 'top 90%',
        end: 'top 20%',
        scrub: true,
      },
      opacity: 0.2,
      stagger: 0.2
    })
  })


// Animation for the text
gsap.from(".teasertext", {
  scrollTrigger: {
    trigger: ".teasertext",
