<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>FORTELATIONS 2026: SYLVARA</title>
<link href="assets/img/favicon.webp" rel="icon">

<!-- Rebuilt lean, same approach as index.html and about.html: no
     style.css, no Bootstrap (and its 6 reboot/grid/utilities
     variants), no AOS/GLightbox/Swiper/boxicons/remixicon/
     bootstrap-icons, no PureCounter, no php-email-form validate.js,
     no main.js. This page has no scroll-jacked/pinned sections --
     the planks are just CSS-positioned elements you scroll past
     natively -- so it also skips GSAP/ScrollTrigger/Lenis entirely
     (index.html still needs Lenis+GSAP for its pinned forest hero;
     this page never did). All of that was dead weight fighting the
     browser's native scroll for no visual benefit, which is the
     "scrolling doesn't feel smooth" complaint -- removing it should
     make scrolling feel like plain native scrolling, because now it
     is. -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  /* Force Cinzel everywhere, including form controls (button/input/
     select/textarea), which browsers do NOT inherit body's font-family
     into by default. */
  *, *::before, *::after { font-family: 'Cinzel', serif; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    font-family: 'Cinzel', serif;
    color: #fff;
    background-color: #0C0129;
  }
  img { max-width: none; }

  @keyframes logo-float {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }

  /* ---------- ambient rising glitter -----------------------------
     Fixed full-page overlay so the motes drift upward across
     whatever part of the page you're scrolled to, rather than being
     scoped to one section. Same technique as the Sylvara theme
     section's magical particles on about.html: JS generates the
     motes with randomized per-particle custom properties (position,
     size, duration, delay -- negative delays so they're already
     mid-flight on load instead of all starting from the bottom at
     once) feeding this one shared keyframe. Sits above the page
     background/content (z-index:5) but well below the fixed header
     (z-index:997) so it never covers the nav, and pointer-events:none
     throughout means it never blocks clicks on the planks underneath. */
  .calendar-particles {
    position: fixed;
    inset: 0;
    z-index: 5;
    overflow: hidden;
    pointer-events: none;
  }
  .calendar-particle {
    position: absolute;
    bottom: -5%;
    left: var(--x, 50%);
    width: var(--size, 4px);
    height: var(--size, 4px);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 244, 214, 0.95) 0%, rgba(255, 221, 139, 0.55) 45%, rgba(255, 221, 139, 0) 75%);
    filter: blur(0.4px);
    animation-name: calendar-particle-rise;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes calendar-particle-rise {
    0%   { transform: translate(0, 0); opacity: 0; }
    12%  { opacity: var(--op, 0.85); }
    50%  { transform: translate(var(--drift, 24px), -55vh); }
    88%  { opacity: var(--op, 0.85); }
    100% { transform: translate(calc(var(--drift, 24px) * -1), -110vh); opacity: 0; }
  }

  /* ---------- header/nav -- identical pattern to index.html/about.html ---------- */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 997;
    height: 80px;
    background: transparent;
    transition: all 0.5s;
  }
  header.header-scrolled {
    background: #342220;
    height: 60px;
  }
  header .container {
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
    padding: 0 16px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  @media (min-width: 576px) { header .container { max-width: 540px; } }
  @media (min-width: 768px) { header .container { max-width: 720px; } }
  @media (min-width: 992px) { header .container { max-width: 960px; } }
  @media (min-width: 1200px) { header .container { max-width: 1140px; } }
  @media (min-width: 1400px) { header .container { max-width: 1320px; } }
  header .logo img { height: auto; max-height: 130px; width: auto; display: block; padding: 0; margin: 0; }
  header.header-scrolled .logo img { max-height: 90px; }
  header nav ul {
    list-style: none;
    display: flex;
    align-items: center;
    margin: 0;
    padding: 0;
  }
  header nav li { position: relative; }
  header nav a {
    display: flex;
    align-items: center;
    padding: 10px 0 10px 30px;
    font-size: 15px;
    font-weight: 500;
    font-family: 'Cinzel', serif;
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    white-space: nowrap;
    transition: 0.3s;
  }
  header nav li > a { position: relative; }
  header nav li > a::before {
    content: "";
    position: absolute;
    width: 0;
    height: 2px;
    bottom: 3px;
    left: 30px;
    background-color: #fff;
    visibility: hidden;
    transition: all 0.3s ease-in-out 0s;
  }
  header nav a:hover, header nav .active { color: #fff; }
  header nav a:hover::before, header nav .active::before {
    visibility: visible;
    width: 25px;
  }
  header nav li:has(button) > a { padding: 0 0 0 30px; }
  header nav li:has(button) > a::before { display: none; }
  header nav button {
    font-size: 15px;
    display: inline-block;
    outline: 0;
    border: 0;
    cursor: pointer;
    will-change: box-shadow, transform;
    background: radial-gradient(100% 100% at 100% 0%, #89E5FF 0%, #5468FF 100%);
    box-shadow: 0px 0.01em 0.01em rgb(45 35 66 / 40%), 0px 0.3em 0.7em -0.01em rgb(45 35 66 / 30%), inset 0px -0.01em 0px rgb(58 65 111 / 50%);
    padding: 0 2em;
    border-radius: 0.3em;
    color: #fff;
    height: 2.6em;
    text-shadow: 0 1px 0 rgb(0 0 0 / 40%);
    transition: box-shadow 0.15s ease, transform 0.15s ease;
    font-weight: 600;
  }
  header nav button:hover {
    box-shadow: 0px 0.1em 0.2em rgb(45 35 66 / 40%), 0px 0.4em 0.7em -0.1em rgb(45 35 66 / 30%), inset 0px -0.1em 0px #3c4fe0;
    transform: translateY(-0.1em);
  }
  header nav button:active {
    box-shadow: inset 0px 0.1em 0.6em #3c4fe0;
    transform: translateY(0em);
  }
  .nav-toggle {
    display: none;
    background: none;
    border: none;
    color: #fff;
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 8px;
  }
  @media (max-width: 900px) {
    .nav-toggle { display: block; }
    header nav ul {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      background: rgba(10, 6, 2, 0.96);
      padding: 8px 0;
    }
    header nav ul.open { display: flex; }
    header nav li { padding: 12px 24px; border-top: 1px solid rgba(255,255,255,0.08); }
    header nav li:first-child { border-top: none; }
    header nav li > a { padding: 0; }
    header nav li > a::before { display: none; }
  }

  /* ============================================================
     CALENDAR HERO -- fountain background, floating heading image
     (previously an "Event Calendar" text heading; swapped for the
     matching hand-drawn heading art like every other page uses).
     ============================================================ */
  .calendar-hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin: 0;
    padding: 80px 20px 8vh;
  }
  .calendar-hero-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    z-index: 0;
  }
  .calendar-hero-heading-img {
    position: relative;
    z-index: 1;
    display: block;
    width: min(88vw, 820px);
    height: auto;
    /* EventCalendar.png has transparent canvas padding -- the
       visible art only spans roughly the middle 52% of the image
       (measured: ~23% empty above, ~25% empty below). Pulling that
       dead space back in with negative margins, same technique as
       the other pages' heading images. */
    margin: -22% 0 -25%;
    filter:
      drop-shadow(0 8px 24px rgba(0, 0, 0, 0.75))
      drop-shadow(0 2px 8px rgba(0, 0, 0, 0.9))
      drop-shadow(0 0 12px rgba(239, 157, 109, 0.4));
    animation: logo-float 3s ease-in-out infinite;
  }
  /* Hero -> calendar-section seam. Instead of the usual single-color
     wash, the transition band is tinted differently across its
     width -- dark forest green at the left and right edges, easing
     into white at the center -- so the seam reads as a soft glow
     rather than a flat curtain. This half lives at the bottom of the
     hero (mask fades transparent at the top down to fully solid at
     the very bottom edge); its mirror image at the top of
     .calendar-section (below) completes the band across the seam. */
  .calendar-hero-fade {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 260px;
    background: linear-gradient(to right, #0f2108 0%, #0f2108 30%, #E7FAF6 50%, #0f2108 70%, #0f2108 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* ============================================================
     CALENDAR SECTION -- VERTICAL PATHWAY SCATTER
     Same approach as the Competitions rock-scatter on index.html:
     planks are placed at percentage top/left coordinates within a
     tall vertical stage so the layout is identical on every screen
     size (scales as a unit rather than reflowing). Left column:
     26-36%, Right column: 64-74% alternating path. No text heading
     here anymore -- the hero above already carries it.
     ============================================================ */
  .calendar-section {
    position: relative;
    z-index: 2;
    width: 100%;
    overflow: hidden;
    padding: 50px 0 120px;
  }
  /* Bottom fade -- eases into the footer's own solid background
     color (#1c3109, matching its vector illustration's near-treeline
     fill) so this section blends straight into the footer instead
     of cutting hard at the boundary. Same eased-curve treatment used
     on index.html's pathway-to-footer seam. */
  .calendar-section::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 300px;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(28, 49, 9, 0.25) 35%,
      rgba(28, 49, 9, 0.65) 65%,
      #1c3109 100%
    );
    z-index: 1;
    pointer-events: none;
  }

  .calendar-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    z-index: -1;
    pointer-events: none;
  }

  /* Mirror of .calendar-hero-fade -- same left/middle/right coloring,
     but starts fully solid at the top (the seam) and fades down to
     transparent, revealing this section's own background beneath. */
  .calendar-section-fade-top {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 260px;
    background: linear-gradient(to right, #0f2108 0%, #0f2108 30%, #E7FAF6 50%, #0f2108 70%, #0f2108 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
    z-index: 0;
    pointer-events: none;
  }

  .plank-scatter {
    position: relative;
    width: 100%;
    /* Raised from 1300px so the stage (and the planks, sized as a
       percentage of it below) keeps growing on larger screens
       instead of plateauing at ordinary laptop widths -- positions
       and sizes are both percentage-based here, so they scale up
       together and stay collision-safe at any width in between.
       Matches the same change on index.html's .rock-scatter. */
    max-width: 1900px;
    margin: 0 auto;
    height: 420vh;
    z-index: 1;
  }

  .plank-card {
    position: absolute;
    cursor: pointer;
    border: none;
    outline: none;
    background: none;
    box-shadow: none;
    padding: 0;
    margin: 0;
    height: auto;
    aspect-ratio: 1 / 1;
    font-size: 0;
    -webkit-tap-highlight-color: transparent;
    will-change: transform;
    transform: translate(-50%, -50%) scale(var(--depth-scale, 1));
    transition: transform 0.3s ease, width 0.3s ease;
    /* Width comes in as an inline percentage (see PLANKS/size in the
       script below) -- this caps the pixel result in step with
       .plank-scatter's new max-width, the same way .rock's clamp()
       does on index.html, so planks keep growing on bigger screens
       but settle at a sensible ceiling instead of ballooning. */
    max-width: 430px;
  }

  .plank-card:hover,
  .plank-card:focus-visible {
    transform: translate(-50%, -50%) scale(calc(var(--depth-scale, 1) * 1.06));
  }

  .plank-card:active {
    outline: none;
  }

  .plank-card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.45))
            drop-shadow(0 0 18px rgba(252,221,139,0.5))
            drop-shadow(0 0 32px rgba(184,190,73,0.3));
    transition: filter 0.3s ease;
  }

  .plank-card:hover img,
  .plank-card:focus-visible img {
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5))
            drop-shadow(0 0 24px rgba(252,221,139,0.8))
            drop-shadow(0 0 44px rgba(184,190,73,0.5));
  }

  .plank-card span {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    font-family: 'Cinzel', serif;
    font-weight: 800;
    font-size: clamp(13px, 1.5vw, 18px);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #FCDD8B;
    text-align: center;
    padding: 0 20%;
    /* Matches the gold-text-plus-drop-shadow treatment used on the
       pathway signs (.pathway-sign-text, index.html) -- swapped from
       the old dark-text-with-gold-halo look to actual yellow text,
       with a real dark shadow underneath so it still reads clearly
       against the light plank wood instead of relying on the glow
       alone for contrast. */
    text-shadow:
      0 0 8px rgba(255, 210, 60, 0.7),
      0 2px 3px rgba(0, 0, 0, 0.85),
      0 1px 2px rgba(0, 0, 0, 0.9);
    pointer-events: none;
  }

  /* ============================================================
     PLANK DETAIL PANEL
     ============================================================ */
  .plank-detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 30, 28, 0.78);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 24px;
  }

  .plank-detail-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .plank-detail-card {
    position: relative;
    background: rgba(20, 38, 34, 0.95);
    border: 2px solid rgba(252, 221, 139, 0.45);
    border-radius: 26px;
    max-width: 480px;
    width: 100%;
    padding: 44px 36px 40px;
    text-align: center;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
    transform: translateY(24px) scale(0.96);
    transition: transform 0.35s ease;
  }

  .plank-detail-overlay.active .plank-detail-card {
    transform: translateY(0) scale(1);
  }

  .plank-detail-title {
    font-family: 'Cinzel', serif;
    font-weight: 800;
    font-size: clamp(24px, 4.5vw, 34px);
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #FCDD8B;
    text-shadow: 0 0 14px #B8BE49;
    margin: 0 0 12px;
  }

  .plank-detail-desc {
    font-family: 'Cinzel', serif;
    color: rgba(255, 255, 255, 0.85);
    font-size: 15px;
    line-height: 1.6;
    margin: 0 0 28px;
  }

  .plank-countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(10px, 2vw, 18px);
  }

  .plank-countdown-unit {
    background: rgba(252, 221, 139, 0.08);
    border: 1px solid rgba(252, 221, 139, 0.25);
    border-radius: 14px;
    padding: 16px 6px;
  }

  .plank-countdown-digits {
    display: flex;
    justify-content: center;
    gap: 3px;
    margin-bottom: 6px;
  }

  .plank-countdown-digits img {
    height: clamp(34px, 6.5vw, 54px);
    max-width: none;
    width: auto;
    filter: drop-shadow(0 0 10px #B8BE49);
  }

  .plank-countdown-label {
    display: block;
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: clamp(9px, 1.2vw, 11px);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #FCDD8B;
  }

  .plank-countdown-passed {
    font-family: 'Cinzel', serif;
    color: #FCDD8B;
    font-weight: 700;
    font-size: 16px;
    margin: 4px 0 0;
  }

  .plank-detail-close {
    position: absolute;
    top: 14px;
    right: 18px;
    background: none;
    border: none;
    box-shadow: none;
    outline: none;
    height: auto;
    padding: 0;
    color: #FCDD8B;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
    opacity: 0.8;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .plank-detail-close:hover {
    opacity: 1;
    transform: scale(1.1);
  }

  /* Bigger tap targets on mobile only. */
  @media (max-width: 768px) {
    .plank-card { width: 32% !important; }
  }

  /* ============================================================
     FOOTER -- same elements as before (rusa loop video, Sylvara
     mark, socials, contact, copyright), restructured into the
     flat-vector-illustration-band + clean-grid layout style (logo
     lockup / nav columns, divider, copyright + socials), matching
     index.html's footer exactly.
     ============================================================ */
  #footer {
    position: relative;
    /* Solid, matching the vector illustration's own near-treeline
       fill (#1c3109) exactly, so the content area below the
       illustration reads as the same ground it's standing on
       instead of jumping to a different, unrelated shade. */
    background: #1c3109;
    color: rgba(255, 255, 255, 0.85);
    font-size: 14px;
    font-family: 'Cinzel', serif;
    overflow: hidden;
  }
  /* Flat-vector landscape band -- layered ridge/treeline shapes, a
     soft gold sun, a couple of birds, twinkling stars, and a winding
     path. Sits directly on the section fade's end color so it reads
     as a continuation, not a new block. */
  .footer-vector-band {
    width: 100%;
    height: clamp(240px, 32vw, 400px);
    line-height: 0;
    overflow: hidden;
  }
  .footer-vector-band svg { display: block; width: 100%; height: 100%; }
  .footer-star {
    fill: #FCE7B3;
    opacity: 0.15;
    animation-name: footer-star-twinkle;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    transform-origin: center;
  }
  @keyframes footer-star-twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: var(--star-op, 0.8); }
  }
  .footer-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    flex-wrap: wrap;
    max-width: 1180px;
    margin: 0 auto;
    padding: 6px 24px 40px;
  }
  .footer-brand { display: flex; align-items: center; gap: 18px; flex: 1; }
  /* Kept as the full uncropped video (not shrunk into a little
     circular icon) -- just given the same warm glow treatment as
     the rest of the site's key art. */
  .footer-favicon {
    width: 150px;
    height: auto;
    border-radius: 14px;
    filter:
      drop-shadow(0 6px 16px rgba(0, 0, 0, 0.55))
      drop-shadow(0 0 22px rgba(252, 221, 139, 0.4))
      drop-shadow(0 0 40px rgba(120, 200, 120, 0.2));
  }
  /* Its own centered slot between the deer and the nav links. */
  .footer-brand-logo {
    flex: 0 0 auto;
    max-width: 360px;
    width: 100%;
    height: auto;
    filter:
      drop-shadow(0 6px 16px rgba(0, 0, 0, 0.6))
      drop-shadow(0 0 20px rgba(239, 157, 109, 0.45));
  }
  .footer-nav-cols {
    display: flex;
    gap: 48px;
    flex: 1;
    justify-content: flex-end;
    flex-wrap: wrap;
  }
  .footer-nav-cols ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .footer-nav-cols a {
    color: rgba(255, 255, 255, 0.68);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: color 0.25s ease;
  }
  .footer-nav-cols a:hover { color: #FCDD8B; }
  .footer-divider {
    height: 1px;
    max-width: 1180px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.08);
  }
  /* Sponsor logos -- small, muted row of chips sitting between the
     nav row and the copyright line. Chips get a pale card background
     so mixed-color/transparent sponsor art reads cleanly regardless
     of this footer's own background color. */
  .footer-sponsors {
    max-width: 1180px;
    margin: 0 auto;
    padding: 4px 24px 28px;
  }
  .footer-sponsors-label {
    margin: 0 0 16px;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
  }
  /* Fixed 12-column grid (rather than a natural flex-wrap) so the
     24 logos always settle into exactly two rows on desktop instead
     of wrapping unpredictably by image width. */
  .footer-sponsors-row {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 16px 20px;
    align-items: center;
    justify-items: center;
  }
  .footer-sponsors-row img {
    height: 44px;
    width: auto;
    max-width: 100%;
    object-fit: contain;
    opacity: 0.88;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .footer-sponsors-row img:hover {
    opacity: 1;
    transform: translateY(-2px);
  }
  @media (max-width: 900px) {
    .footer-sponsors-row { grid-template-columns: repeat(8, 1fr); gap: 14px 16px; }
    .footer-sponsors-row img { height: 38px; }
  }
  @media (max-width: 640px) {
    .footer-sponsors-row { grid-template-columns: repeat(6, 1fr); gap: 12px 14px; }
    .footer-sponsors-row img { height: 32px; }
  }
  /* Bottom row is a single centered stack -- copyright, contact,
     then socials. */
  .footer-bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    max-width: 1180px;
    margin: 0 auto;

<script>
  const navToggle = document.getElementById('navToggle');
  const navList = document.getElementById('navList');
  if (navToggle && navList) {
    navToggle.addEventListener('click', () => {
      const isOpen = navList.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', String(isOpen));
    });
  }

  const headerEl = document.querySelector('header');
  if (headerEl) {
    const updateHeaderScrolled = () => {
      headerEl.classList.toggle('header-scrolled', window.scrollY > 100);
    };
    window.addEventListener('scroll', updateHeaderScrolled);
    updateHeaderScrolled();
  }

  // ---------- Ambient rising glitter ----------
  // Same generator as the Sylvara theme section's magical particles
  // on about.html: randomized position/size/duration/drift per mote,
  // with negative animation-delay so they're already mid-flight on
  // load instead of all starting from the bottom at once. This one
  // lives in a fixed full-page container (see CSS), so it drifts
  // over the whole page as you scroll rather than just one section.
  (function calendarParticles() {
    const container = document.getElementById('calendarParticles');
    if (!container) return;

    const COUNT = 28;
    const frag = document.createDocumentFragment();

    for (let i = 0; i < COUNT; i++) {
      const span = document.createElement('span');
      span.className = 'calendar-particle';

      const x = (Math.random() * 100).toFixed(1) + '%';
      const size = (2 + Math.random() * 4).toFixed(1) + 'px';
      const duration = (7 + Math.random() * 8).toFixed(2) + 's';
      const delay = (-Math.random() * 15).toFixed(2) + 's'; // negative -> already mid-animation on load
      const drift = (Math.random() * 60 - 30).toFixed(0) + 'px';
      const op = (0.45 + Math.random() * 0.5).toFixed(2);

      span.style.cssText =
        '--x:' + x +
        '; --size:' + size +
        '; --drift:' + drift +
        '; --op:' + op +
        '; animation-duration:' + duration +
        '; animation-delay:' + delay + ';';

      frag.appendChild(span);
    }

    container.appendChild(frag);
  })();

  /* ============================================================
     CALENDAR PAGE -- VERTICAL PATHWAY SCATTER
     Mirrors the Competitions rock-scatter approach from index.html:
     planks are placed at fixed percentage top/left coordinates so
     the layout is identical on every screen size. No scroll-driven
     animation here -- just CSS-positioned planks the user scrolls
     past naturally as the page scrolls down.

     Each plank entry carries:
       label : display title shown on the plank
       top   : % from top of .plank-scatter stage (420vh tall)
       left  : % from left of stage (26-36% = left path, 64-74% = right path)
       size  : plank width as % of stage width
       z     : stacking depth (higher = "closer", slightly larger via --depth-scale)
       date  : target date for the click-to-open countdown
       desc  : description shown in the detail panel
       art   : optional override for plank image; defaults to alternating plank1/plank2
  ============================================================ */
  // Dates updated to match Fortelations' actual schedule: Opening on
  // September 12 (Sat), running one day per plank through Closing on
  // September 20 (Sun). Technical Meeting is set to September 7
  // (Mon), matching the date already referenced in a couple of the
  // competition ketentuan on index.html (CCA, MUN) rather than being
  // folded into the consecutive Opening-to-Closing run.
  const PLANKS = [
    { label: "Technical Meeting", top: 3.3,  left: 32.9, size: 26, z: 3, date: "September 7, 2026",  desc: "Coordinators and team representatives align on rules, schedules, and logistics ahead of the festival." },
    { label: "Opening",           top: 14.6, left: 72.5, size: 26, z: 3, date: "September 12, 2026",  desc: "Sylvara officially begins — opening ceremony, welcome address, and the first taste of festival energy." },
    { label: "Day 1",             top: 23.1, left: 28.3, size: 26, z: 3, date: "September 13, 2026",  desc: "The first full day of competitions kicks off across every category." },
    { label: "Day 2",             top: 32.9, left: 66.3, size: 26, z: 3, date: "September 14, 2026",  desc: "Competitions continue, with new categories taking the stage." },

    { label: "Day 4",             top: 54.1, left: 66.1, size: 26, z: 3, date: "September 16, 2026",  desc: "Competitions roll on as finalists begin to emerge across several categories." },

  function buildPlankScatter() {
    const stage = document.getElementById('plankScatter');
    if (!stage) return;
    stage.innerHTML = '';

    PLANKS.forEach((plank, i) => {
      const art = plank.art || (i % 2 === 0 ? 'plank1.png' : 'plank2.png');

      const card = document.createElement('button');
      card.className = 'plank-card';
      card.type = 'button';
      card.setAttribute('aria-label', plank.label);

      card.style.top   = `${plank.top}%`;
      card.style.left  = `${plank.left}%`;
      card.style.width = `${plank.size}%`;
      card.style.zIndex = String(plank.z);

      const depthScale = 0.9 + (plank.z * 0.04);
      card.style.setProperty('--depth-scale', depthScale);

      const img = document.createElement('img');
      img.src = `assets/img/${art}`;
      img.alt = plank.label;
      img.loading = 'lazy';

      const label = document.createElement('span');
      label.textContent = plank.label;

      card.appendChild(img);
      card.appendChild(label);
      stage.appendChild(card);

      card.addEventListener('click', () => openPlankDetail(plank));
    });
  }

  buildPlankScatter();

  /* ----------------------------------------------------------------
     PLANK DETAIL PANEL + COUNTDOWN
     Opens on click with the plank's title/description, plus a live
     countdown to its date rendered with the same digit-image style
     (assets/img/Numbers/0.png - 9.png) as the homepage countdown.
     Each open swaps in fresh digit elements and starts its own
     interval; the previous interval is cleared on close (or before
     a new plank opens) so multiple timers never stack up running
     in the background.
     ---------------------------------------------------------------- */
  let plankCountdownInterval = null;
  const plankDigitState = {};

  function setPlankDigit(containerId, value) {
    const container = document.getElementById(containerId);
    if (!container) return;
    const str = String(value).padStart(2, '0');

    [...str].forEach((digit, i) => {
      const slotKey = `${containerId}-${i}`;
      let img = container.children[i];
      if (!img) {
        img = document.createElement('img');
        img.alt = digit;
        container.appendChild(img);
      }
      if (plankDigitState[slotKey] === digit) return;
      plankDigitState[slotKey] = digit;
      img.src = `assets/img/Numbers/${digit}.png`;
      img.alt = digit;
    });
  }

  function startPlankCountdown(targetDateStr) {
    if (plankCountdownInterval) clearInterval(plankCountdownInterval);

    const targetDate = new Date(`${targetDateStr} 00:00:00`).getTime();
    const countdownEl = document.getElementById('plankCountdown');
    const passedEl   = document.getElementById('plankCountdownPassed');

    function tick() {
      const now      = Date.now();
      const distance = targetDate - now;

      if (distance <= 0) {
        countdownEl.style.display = 'none';
        passedEl.style.display    = 'block';
        clearInterval(plankCountdownInterval);
        return;
      }

      countdownEl.style.display = 'grid';
      passedEl.style.display    = 'none';

      const days    = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours   = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      setPlankDigit('plankDays',    days);
      setPlankDigit('plankHours',   hours);
      setPlankDigit('plankMinutes', minutes);
      setPlankDigit('plankSeconds', seconds);
    }

    tick();
    plankCountdownInterval = setInterval(tick, 1000);
  }

  function openPlankDetail(plank) {
    document.getElementById('plankDetailTitle').textContent = plank.label;
    document.getElementById('plankDetailDesc').textContent  = plank.desc || '';
    document.getElementById('plankOverlay').classList.add('active');
    startPlankCountdown(plank.date);
  }

  function closePlankDetail() {
    document.getElementById('plankOverlay').classList.remove('active');
    if (plankCountdownInterval) {
      clearInterval(plankCountdownInterval);
      plankCountdownInterval = null;
    }
  }

  document.getElementById('plankClose')?.addEventListener('click', closePlankDetail);
  document.getElementById('plankOverlay')?.addEventListener('click', (e) => {
    if (e.target.id === 'plankOverlay') closePlankDetail();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePlankDetail();
  });
</script>
