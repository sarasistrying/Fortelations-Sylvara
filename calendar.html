  <style>
    /* ============================================================
       BACKGROUND FIX (carried over from index.html)
       Keeps any fixed-position background art visible behind the
       whole page rather than scoped only to its own section.
       ============================================================ */
    .parallaxbackground {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      pointer-events: none;
    }

    /* ============================================================

       Fountain background image, full hero height, with an
       "EVENT CALENDAR" title using the same gentle float animation
       index.html uses on its logo (logo-float keyframes further
       down in this file).
       ============================================================ */

      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 0;
      padding: 80px 0 0;
      background: none;
    }

    .calendar-hero-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
    }

    .calendar-heading {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 80px 20px 20px;
    }

    .calendar-heading h2 {
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: clamp(28px, 5vw, 48px);
      color: #FCDD8B;
      text-shadow: 0 0 12px #B8BE49, 0 0 30px rgba(239, 157, 109, 0.35);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin: 0;
    }

    .calendar-hero-title {
      position: relative;
      z-index: 1;
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: clamp(36px, 7vw, 84px);
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #FCDD8B;
      text-shadow: 0 0 15px #B8BE49, 0 0 35px rgba(239, 157, 109, 0.5);
      text-align: center;
      padding: 0 20px;
      animation: logo-float 3s ease-in-out infinite;
    }

    @keyframes logo-float {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.02);
      }
    }

    /* ============================================================
       CALENDAR SECTION — VERTICAL PATHWAY SCATTER
       Same approach as the Competitions rock-scatter on index.html:
       planks are placed at percentage top/left coordinates within a
       tall vertical stage so the layout is identical on every
       screen size (scales as a unit rather than reflowing).
       Left column: 26-36%, Right column: 64-74% alternating path.
       ============================================================ */
    .calendar-section {
      position: relative;
      z-index: 2;
      width: 100%;
      overflow: hidden;
      padding-bottom: 120px;
    }

    .calendar-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      max-width: none !important;
      height: 100% !important;
      object-fit: cover;
      object-position: top;
      z-index: -1;
      pointer-events: none;
    }

    .plank-scatter {
      position: relative;
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
      height: 420vh;
      z-index: 1;
    }

    .plank-card {
      position: absolute !important;
      cursor: pointer !important;
      border: none !important;
      outline: none !important;
      background: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      height: auto !important;
      aspect-ratio: 1 / 1 !important;
      font-size: 0 !important;
      appearance: none !important;
      -webkit-appearance: none !important;
      -webkit-tap-highlight-color: transparent;
      will-change: transform;
      transform: translate(-50%, -50%) scale(var(--depth-scale, 1)) !important;
      transition: transform 0.3s ease !important;
    }

    .plank-card:hover,
    .plank-card:focus-visible {
      transform: translate(-50%, -50%) scale(calc(var(--depth-scale, 1) * 1.06)) !important;
    }

    .plank-card:active {
      transform: translate(-50%, -50%) scale(calc(var(--depth-scale, 1) * 1.06)) !important;
      outline: none !important;
    }

    .plank-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.45))
              drop-shadow(0 0 18px rgba(252,221,139,0.5))
              drop-shadow(0 0 32px rgba(184,190,73,0.3));
      transition: filter 0.3s ease;
    }

    .plank-card:hover img,
    .plank-card:focus-visible img {
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5))
              drop-shadow(0 0 24px rgba(252,221,139,0.8))
              drop-shadow(0 0 44px rgba(184,190,73,0.5));
    }

    .plank-card span {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: clamp(13px, 1.5vw, 18px);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #2C1205;
      text-align: center;
      padding: 0 20%;
      text-shadow:
        0 0 8px rgba(255, 210, 60, 0.9),
        0 0 16px rgba(255, 180, 20, 0.7),
        0 0 28px rgba(255, 160, 0, 0.5);
      pointer-events: none;
    }
    /* ============================================================
       PLANK DETAIL PANEL
       ============================================================ */
    .plank-detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 30, 28, 0.78);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 24px;
    }

    .plank-detail-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .plank-detail-card {
      position: relative;
      background: rgba(20, 38, 34, 0.95);
      border: 2px solid rgba(252, 221, 139, 0.45);
      border-radius: 26px;
      max-width: 480px;
      width: 100%;
      padding: 44px 36px 40px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      transform: translateY(24px) scale(0.96);
      transition: transform 0.35s ease;
    }

    .plank-detail-overlay.active .plank-detail-card {
      transform: translateY(0) scale(1);
    }

    .plank-detail-title {
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: clamp(24px, 4.5vw, 34px);
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #FCDD8B;
      text-shadow: 0 0 14px #B8BE49;
      margin: 0 0 12px;

    .plank-detail-desc {
      font-family: 'Open Sans', sans-serif;
      color: rgba(255, 255, 255, 0.85);
      font-size: 15px;
      line-height: 1.6;

    .plank-countdown {

    }

    .plank-countdown-unit {
      background: rgba(252, 221, 139, 0.08);
      border: 1px solid rgba(252, 221, 139, 0.25);
      border-radius: 14px;
      padding: 16px 6px;
    }

    .plank-countdown-digits {
      display: flex;
      justify-content: center;
      gap: 3px;
      margin-bottom: 6px;
    }

    .plank-countdown-digits img {
      height: clamp(34px, 6.5vw, 54px) !important;
      max-width: none !important;
      width: auto !important;
      filter: drop-shadow(0 0 10px #B8BE49);
    }

    .plank-countdown-label {
      display: block;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: clamp(9px, 1.2vw, 11px);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #FCDD8B;
    }

    .plank-countdown-passed {
      font-family: 'Open Sans', sans-serif;
      color: #FCDD8B;
      font-weight: 700;
      font-size: 16px;
      margin: 4px 0 0;
    }

    .plank-detail-close {
      position: absolute;
      top: 14px;
      right: 18px;
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      outline: none !important;
      height: auto !important;
      padding: 0 !important;
      color: #FCDD8B;
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .plank-detail-close:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    #header .logo img {
      max-height: 200px !important;
    }
  </style>
</head>

<script>
  /* ============================================================
     CALENDAR PAGE — VERTICAL PATHWAY SCATTER
     Mirrors the Competitions rock-scatter approach from index.html:
     planks are placed at fixed percentage top/left coordinates so
     the layout is identical on every screen size. No GSAP/Lenis
     scroll-driven animation here -- just CSS-positioned planks
     the user scrolls past naturally as the page scrolls down.

     Each plank entry carries:
       label : display title shown on the plank
       top   : % from top of .plank-scatter stage (420vh tall)
       left  : % from left of stage (26-36% = left path, 64-74% = right path)
       size  : plank width as % of stage width
       z     : stacking depth (higher = "closer", slightly larger via --depth-scale)
       date  : target date for the click-to-open countdown
       desc  : description shown in the detail panel
       art   : optional override for plank image; defaults to alternating plank1/plank2
  ============================================================ */
  const PLANKS = [
    { label: "Technical Meeting", top: 3.3,  left: 32.9, size: 26, z: 3, date: "September 1, 2026",  desc: "Coordinators and team representatives align on rules, schedules, and logistics ahead of the festival." },
    { label: "Opening",           top: 14.6, left: 72.5, size: 26, z: 3, date: "September 2, 2026",  desc: "Sylvara officially begins — opening ceremony, welcome address, and the first taste of festival energy." },
    { label: "Day 1",             top: 23.1, left: 28.3, size: 26, z: 3, date: "September 3, 2026",  desc: "The first full day of competitions kicks off across every category." },
    { label: "Day 2",             top: 32.9, left: 66.3, size: 26, z: 3, date: "September 4, 2026",  desc: "Competitions continue, with new categories taking the stage." },
    { label: "Day 3",             top: 44.7, left: 27.3, size: 26, z: 3, date: "September 5, 2026",  desc: "Midway through the festival — more heats, more performances, more energy." },
    { label: "Day 4",             top: 54.1, left: 66.1, size: 26, z: 3, date: "September 6, 2026",  desc: "Competitions roll on as finalists begin to emerge across several categories." },
    { label: "Day 5",             top: 63.4, left: 30.3, size: 26, z: 3, date: "September 7, 2026",  desc: "The penultimate stretch — semifinals and standout showcases." },
    { label: "Day 6",             top: 75.0, left: 70.1, size: 26, z: 3, date: "September 8, 2026",  desc: "Final competitions wrap up as the festival builds toward its close." },
    { label: "Day 7",             top: 82.5, left: 28.8, size: 26, z: 3, date: "September 9, 2026",  desc: "The last full day of competition before Sylvara closes its gates." },
    { label: "Closing",           top: 92.9, left: 72.7, size: 26, z: 3, date: "September 10, 2026", desc: "Awards, farewells, and a final celebration as Sylvara 2026 comes to a close." },
  ];

  function buildPlankScatter() {
    const stage = document.getElementById('plankScatter');
    if (!stage) return;
    stage.innerHTML = '';

    PLANKS.forEach((plank, i) => {
      const art = plank.art || (i % 2 === 0 ? 'plank1.png' : 'plank2.png');

      const card = document.createElement('button');
      card.className = 'plank-card';
      card.type = 'button';
      card.setAttribute('aria-label', plank.label);

      card.style.top   = `${plank.top}%`;
      card.style.left  = `${plank.left}%`;
      card.style.width = `${plank.size}%`;
      card.style.zIndex = String(plank.z);

      const depthScale = 0.9 + (plank.z * 0.04);
      card.style.setProperty('--depth-scale', depthScale);

      const img = document.createElement('img');
      img.src = `assets/img/${art}`;
      img.alt = plank.label;
      img.loading = 'lazy';

      const label = document.createElement('span');
      label.textContent = plank.label;

      card.appendChild(img);
      card.appendChild(label);
      stage.appendChild(card);

      card.addEventListener('click', () => openPlankDetail(plank));
    });
  }

  buildPlankScatter();

  /* ----------------------------------------------------------------
     PLANK DETAIL PANEL + COUNTDOWN
     Opens on click with the plank's title/description, plus a live
     countdown to its date rendered with the same digit-image style
     (assets/img/Numbers/0.png - 9.png) as the homepage countdown.
     Each open swaps in fresh digit elements and starts its own
     interval; the previous interval is cleared on close (or before
     a new plank opens) so multiple timers never stack up running
     in the background.
     ---------------------------------------------------------------- */
  let plankCountdownInterval = null;
  const plankDigitState = {};

  function setPlankDigit(containerId, value) {
    const container = document.getElementById(containerId);
    if (!container) return;
    const str = String(value).padStart(2, '0');

    [...str].forEach((digit, i) => {
      const slotKey = `${containerId}-${i}`;
      let img = container.children[i];
      if (!img) {
        img = document.createElement('img');
        img.alt = digit;
        container.appendChild(img);
      }
      if (plankDigitState[slotKey] === digit) return;
      plankDigitState[slotKey] = digit;
      img.src = `assets/img/Numbers/${digit}.png`;
      img.alt = digit;
    });
  }

  function startPlankCountdown(targetDateStr) {
    if (plankCountdownInterval) clearInterval(plankCountdownInterval);

    const targetDate = new Date(`${targetDateStr} 00:00:00`).getTime();
    const countdownEl = document.getElementById('plankCountdown');
    const passedEl   = document.getElementById('plankCountdownPassed');

    function tick() {
      const now      = Date.now();
      const distance = targetDate - now;

      if (distance <= 0) {
        countdownEl.style.display = 'none';
        passedEl.style.display    = 'block';
        clearInterval(plankCountdownInterval);
        return;
      }

      countdownEl.style.display = 'grid';
      passedEl.style.display    = 'none';

      const days    = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours   = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      setPlankDigit('plankDays',    days);
      setPlankDigit('plankHours',   hours);
      setPlankDigit('plankMinutes', minutes);
      setPlankDigit('plankSeconds', seconds);
    }

    tick();
    plankCountdownInterval = setInterval(tick, 1000);
  }

  function openPlankDetail(plank) {
    document.getElementById('plankDetailTitle').textContent = plank.label;
    document.getElementById('plankDetailDesc').textContent  = plank.desc || '';
    document.getElementById('plankOverlay').classList.add('active');
    startPlankCountdown(plank.date);
  }

  function closePlankDetail() {
    document.getElementById('plankOverlay').classList.remove('active');
    if (plankCountdownInterval) {
      clearInterval(plankCountdownInterval);
      plankCountdownInterval = null;
    }
  }

  document.getElementById('plankClose')?.addEventListener('click', closePlankDetail);
  document.getElementById('plankOverlay')?.addEventListener('click', (e) => {
    if (e.target.id === 'plankOverlay') closePlankDetail();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePlankDetail();
  });
</script>
