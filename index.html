<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>FORTELATIONS 2026: SYLVARA</title>
<link href="assets/img/favicon.webp" rel="icon">

<!-- Only what the pin sequence actually needs. Deliberately NOT
     loaded here: assets/css/style.css, Bootstrap, AOS, GLightbox,
     Swiper, boxicons/remixicon/bootstrap-icons, assets/js/main.js,
     SplitType, PureCounter. Once the pin is confirmed solid on this
     lean build, those get reintroduced one at a time so we can see
     exactly which one (if any) was the actual conflict, instead of
     guessing against all of them at once. -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; } /* never smooth-scroll alongside Lenis */
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #fff;
    background-color: #0C0129;
  }
  img { max-width: none; }

  /* ---------- header/nav, ported from style.css's #header/.navbar
     rules (colors, spacing, hover-underline effect) but rewritten
     to only touch header/nav elements -- none of style.css's other
     global rules (section/html/img resets) are loaded, so this
     can't reintroduce the bugs those caused elsewhere on the page ---------- */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 997;
    height: 80px;
    background: transparent;
    transition: all 0.5s;
  }
  header.header-scrolled {
    background: #342220;
    height: 60px;
  }
  /* Bootstrap-style .container: fixed max-width per breakpoint
     with a centered, fluid gutter -- instead of my earlier
     percentage-padding approach, which stretched content edge to
     edge on very wide screens instead of sitting in a boxed column
     like the original did. */
  header .container {
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
    padding: 0 16px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  @media (min-width: 576px) { header .container { max-width: 540px; } }
  @media (min-width: 768px) { header .container { max-width: 720px; } }
  @media (min-width: 992px) { header .container { max-width: 960px; } }
  @media (min-width: 1200px) { header .container { max-width: 1140px; } }
  @media (min-width: 1400px) { header .container { max-width: 1320px; } }
  header .logo img { height: auto; max-height: 130px; width: auto; display: block; padding: 0; margin: 0; }
  header.header-scrolled .logo img { max-height: 90px; }
  header nav ul {
    list-style: none;
    display: flex;
    align-items: center;
    margin: 0;
    padding: 0;
  }
  header nav li { position: relative; }
  header nav a {
    display: flex;
    align-items: center;
    padding: 10px 0 10px 30px;
    font-size: 15px;
    font-weight: 500;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    white-space: nowrap;
    transition: 0.3s;
  }
  header nav li > a {
    position: relative;
  }
  header nav li > a::before {
    content: "";
    position: absolute;
    width: 0;
    height: 2px;
    bottom: 3px;
    left: 30px;
    background-color: #fff;
    visibility: hidden;
    transition: all 0.3s ease-in-out 0s;
  }
  header nav a:hover, header nav .active { color: #fff; }
  header nav a:hover::before, header nav .active::before {
    visibility: visible;
    width: 25px;
  }
  /* the Registration link wraps a <button>, not plain text --
     exclude it from the underline/padding nav-link treatment so
     it doesn't visually fight with the button's own styling */
  header nav li:has(button) > a {
    padding: 0 0 0 30px;
  }
  header nav li:has(button) > a::before {
    display: none;
  }
  header nav button {
    font-size: 15px;
    display: inline-block;
    outline: 0;
    border: 0;
    cursor: pointer;
    will-change: box-shadow, transform;
    background: radial-gradient(100% 100% at 100% 0%, #89E5FF 0%, #5468FF 100%);
    box-shadow: 0px 0.01em 0.01em rgb(45 35 66 / 40%), 0px 0.3em 0.7em -0.01em rgb(45 35 66 / 30%), inset 0px -0.01em 0px rgb(58 65 111 / 50%);
    padding: 0 2em;
    border-radius: 0.3em;
    color: #fff;
    height: 2.6em;
    text-shadow: 0 1px 0 rgb(0 0 0 / 40%);
    transition: box-shadow 0.15s ease, transform 0.15s ease;
    font-weight: 600;
  }
  header nav button:hover {
    box-shadow: 0px 0.1em 0.2em rgb(45 35 66 / 40%), 0px 0.4em 0.7em -0.1em rgb(45 35 66 / 30%), inset 0px -0.1em 0px #3c4fe0;
    transform: translateY(-0.1em);
  }
  header nav button:active {
    box-shadow: inset 0px 0.1em 0.6em #3c4fe0;
    transform: translateY(0em);
  }
  .nav-toggle {
    display: none;
    background: none;
    border: none;
    color: #fff;
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 8px;
  }
  @media (max-width: 900px) {
    .nav-toggle { display: block; }
    header nav ul {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      background: rgba(10, 6, 2, 0.96);
      padding: 8px 0;
    }
    header nav ul.open { display: flex; }
    header nav li { padding: 12px 24px; border-top: 1px solid rgba(255,255,255,0.08); }
    header nav li:first-child { border-top: none; }
    header nav li > a { padding: 0; }
    header nav li > a::before { display: none; }
  }

  /* ============================================================
     FOREST MULTIPLANE HERO + COUNTDOWN (unchanged from the
     already-proven version, just without style.css/Bootstrap
     fighting it in the background anymore)
     ============================================================ */
  .forest-hero-trigger {
    position: relative;
    display: block;
    width: 100%;
    height: 450vh;
    padding: 0;
    margin: 0;
    overflow: visible;
  }

  .forest-stage {
    position: relative;
    display: block;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    margin: 0; padding: 0;
    overflow: hidden;
    background: #0c1608;
  }
  /* Everything inside stays hidden (the dark background above acts
     as a natural loading placeholder) until JS has finished
     building the trees, GSAP has applied every element's correct
     starting state, and the page has fully loaded with a
     ScrollTrigger refresh against final image dimensions. Prevents
     a visible flash/snap where things briefly render at their raw
     default position/scale before settling into place. */
  .forest-stage > * {
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .forest-stage.is-ready > * {
    opacity: 1;
  }

  .forest-layer {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    display: block;
    width: 100%; height: 100%;
    margin: 0;
    object-fit: cover;
    pointer-events: none;
    will-change: transform, opacity;
  }

  .forest-bg { z-index: 1; object-position: center; }

  .forest-trees {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    z-index: 2;
    pointer-events: none;
    transform-origin: bottom center;
  }

  .forest-tree-farmid {
    position: absolute;
    width: auto;
    height: 34vh;
    max-height: 1150px;
    opacity: 1;
    z-index: 2;
    filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.4));
    will-change: transform, opacity;
  }

  .forest-tree-nearmid {
    position: absolute;
    width: auto;
    height: 68vh;
    max-height: 1100px;
    opacity: 1;
    z-index: 3;
    filter:
      drop-shadow(0 16px 26px rgba(0, 0, 0, 0.55))
      drop-shadow(0 0 20px rgba(0, 0, 0, 0.3));
    will-change: transform, opacity;
  }

  .forest-near {
    z-index: 4;
    object-fit: cover;
    opacity: 1;
    transform: translateY(5vh);
  }
  .forest-near-left { object-position: left bottom; }
  .forest-near-right { object-position: right bottom; }

  /* ============================================================
     COUNTDOWN BACKDROP TREES -- reuses TreeLeft/TreeRight (the
     same dramatic corner-crop trees from the hero opening) rather
     than the smaller mid-tree variants, so the countdown backdrop
     matches the hero's scale. Distinct class from the flythrough
     farmid/nearmid trees above, so they're not swept up in those
     groups' fade-out tweens -- these fade IN as the flythrough
     trees fade OUT, giving a continuous "still in the forest"
     backdrop instead of a hard cut to an empty background.
     z-index sits below the countdown (5) but above the plain
     background (1).
     ============================================================ */
  .forest-backdrop-edge {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 46vw;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    z-index: 2;
    will-change: opacity;
  }
  .forest-backdrop-edge-left { left: 0; object-position: left bottom; }
  .forest-backdrop-edge-right { right: 0; object-position: right bottom; }

  .forest-backdrop-tall {
    position: absolute;
    width: auto;
    height: 100vh;
    max-height: 1300px;
    opacity: 0;
    z-index: 2;
    filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.45));
    will-change: opacity;
  }

  .forest-logo {
    position: absolute;
    inset: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    transform: translateY(6vh);
  }
  .forest-logo img {
    width: min(96vw, 1180px);
    height: auto;
    filter: drop-shadow(0 0 30px rgba(184, 190, 73, 0.55));
    animation: logo-float 3s ease-in-out infinite;
  }
  @keyframes logo-float {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }

  .forest-countdown {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 4vw, 40px);
    padding: 20px;
    opacity: 0;
    pointer-events: none;
  }
  .forest-countdown .countdown-timer {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: clamp(20px, 4vw, 44px);
    max-width: min(95vw, 1400px);
    width: 100%;
  }
  .forest-countdown .countdown-box {
    background: rgba(0, 0, 0, 0.55);
    border: 2px solid rgba(184, 190, 73, 0.4);
    border-radius: 28px;
    padding: 48px 32px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    transition: all 0.3s ease;
  }
  .forest-countdown .countdown-box:hover {
    background: rgba(239, 157, 109, 0.25);
    box-shadow: 0 0 30px rgba(239, 157, 109, 0.5), inset 0 0 30px rgba(239, 157, 109, 0.2);
    transform: translateY(-5px);
  }
  .forest-countdown .countdown-number {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin-bottom: 10px;
  }
  .forest-countdown .countdown-digit {
    height: clamp(56px, 11vw, 110px);
    width: auto;
    filter: drop-shadow(0 0 15px #B8BE49);
  }
  .forest-countdown .countdown-label {
    font-size: clamp(15px, 2.4vw, 20px);
    font-weight: 600;
    color: #FCDD8B;
    text-shadow: 0px 0px 20px rgba(252, 221, 139, 0.6);
  }

  .leaf-wipe {
    position: absolute;
    inset: 0;
    z-index: 7;
    background: radial-gradient(circle at 50% 20%, #5a7a28 0%, #2f4614 55%, #14200a 100%);
    transform: translateY(100%);
    pointer-events: none;
  }

  @media (max-width: 769px) {
    .forest-hero-trigger { height: 380vh; }
    /* The per-tree heights are set via inline styles in JS
       (el.style.height = ...), and inline styles always beat any
       CSS class rule -- including a media query -- so overriding
       .forest-tree-farmid/.forest-tree-nearmid's height here never
       actually did anything. Scaling the whole #forestTrees
       container instead works regardless of how each tree's own
       height was set. */
    #forestTrees { transform: scale(0.62); }

    /* No countdown backdrop trees on mobile -- too cluttered on a
       small screen alongside the countdown boxes themselves. */
    .forest-backdrop-edge,
    .forest-backdrop-tall {
      display: none !important;
    }

    /* Force a 2x2 grid instead of letting auto-fit collapse to a
       single narrow column of 4 stacked boxes -- fits all four on
       screen at once and gives each box more usable width for the
       digits, rather than one cramped column. */
    .forest-countdown .countdown-timer {
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .forest-countdown .countdown-box { padding: 24px 16px; }
    .forest-countdown .countdown-digit { height: clamp(40px, 9vw, 70px); }
  }

  /* ============================================================
     COMPETITIONS — rock scatter (ported as-is, self-contained,
     no Bootstrap dependency to begin with)
     ============================================================ */
  .competitions-section {
    position: relative;
    z-index: 2;
    width: 100%;
    padding-bottom: 160px;
  }
  .competitions-heading {
    position: relative;
    z-index: 3;
    text-align: center;
    padding: 100px 20px 60px;
  }
  .section-heading-img {
    display: block;
    width: min(80vw, 820px);
    height: auto;
    margin: -12% auto -12%;
    filter:
      drop-shadow(0 8px 24px rgba(0, 0, 0, 0.75))
      drop-shadow(0 2px 8px rgba(0, 0, 0, 0.9))
      drop-shadow(0 0 12px rgba(239, 157, 109, 0.4));
    animation: logo-float 3s ease-in-out infinite;
  }
  .competitions-heading p {
    font-family: 'Open Sans', sans-serif;
    font-size: clamp(13px, 1.6vw, 16px);
    color: rgba(255, 255, 255, 0.7);
    margin: 0;
  }
  .competitions-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: top;
    z-index: 0;
    pointer-events: none;
  }
  .rock-scatter {
    position: relative;
    width: 100%;
    max-width: 1300px;
    margin: 0 auto;
    height: 420vh;
    z-index: 1;
  }
  .rock {
    position: absolute;
    width: 20%;
    height: auto;
    aspect-ratio: 1 / 1;
    cursor: pointer;
    display: block;
    border: none;
    outline: none;
    background: none;
    box-shadow: none;
    padding: 0;
    margin: 0;
    font-size: 0;
    will-change: transform;
    transform: translate(-50%, -50%) scale(var(--depth-scale, 1));
    transition: transform 0.3s ease;
  }
  .rock:hover, .rock:focus-visible {
    transform: translate(-50%, -50%) scale(calc(var(--depth-scale, 1) * 1.08));
  }
  .rock img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.55));
    transition: filter 0.3s ease;
  }
  .rock:hover img, .rock:focus-visible img {
    filter: drop-shadow(0 0 14px rgba(184, 190, 73, 0.65)) drop-shadow(0 4px 6px rgba(0, 0, 0, 0.6));
  }
  .rock-label {
    position: absolute;
    left: 50%; bottom: -14%;
    transform: translate(-50%, 0);
    width: 100%;
    text-align: center;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(11px, 1.3vw, 14px);
    letter-spacing: 0.3px;
    text-transform: uppercase;
    color: #FCDD8B;
    text-shadow: 0 2px 5px rgba(0, 0, 0, 0.85), 0 0 10px rgba(0, 0, 0, 0.6);
    opacity: 1;
    pointer-events: none;
    line-height: 1.2;
  }

  /* Bigger tap targets on mobile only -- desktop's 20% above
     stays untouched. */
  @media (max-width: 768px) {
    .rock { width: 32%; }
  }
  /* ============================================================
     ROCK DETAIL OVERLAY -- a centered modal shared by every stone
     (click a stone, its info appears here; close via the X, the
     backdrop, or Escape). Same pattern as calendar.html's
     plank-detail-overlay so the two pages behave consistently.
     ============================================================ */
  .rock-detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 30, 28, 0.78);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 24px;
  }
  .rock-detail-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .rock-detail-card {
    position: relative;
    background: rgba(20, 38, 34, 0.95);
    border: 2px solid rgba(252, 221, 139, 0.45);
    border-radius: 26px;
    max-width: 480px;
    width: 100%;
    padding: 44px 36px 40px;
    text-align: center;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
    transform: translateY(24px) scale(0.96);
    transition: transform 0.35s ease;
  }
  .rock-detail-overlay.active .rock-detail-card {
    transform: translateY(0) scale(1);
  }
  .rock-detail-title {
    font-family: 'Cinzel', serif;
    font-weight: 800;
    font-size: clamp(24px, 4.5vw, 34px);
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #FCDD8B;
    text-shadow: 0 0 14px #B8BE49;
    margin: 0 0 12px;
  }
  .rock-detail-desc {
    font-family: 'Open Sans', sans-serif;
    color: rgba(255, 255, 255, 0.85);
    font-size: 15px;
    line-height: 1.6;
    margin: 0;
  }
  .rock-detail-close {
    position: absolute;
    top: 14px;
    right: 18px;
    background: none !important;
    border: none !important;
    box-shadow: none !important;
    outline: none !important;
    height: auto !important;
    padding: 0 !important;
    color: #FCDD8B;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
    opacity: 0.8;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .rock-detail-close:hover {
    opacity: 1;
    transform: scale(1.1);
  }

  /* ============================================================
     PATHWAY — two wooden signs
     ============================================================ */
  .pathway-section {
    position: relative;
    min-height: 100vh;
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    padding: 60px 6%;
    gap: 24px 40px;
    background: #142310;
  }
  .pathway-sign {
    position: relative;
    z-index: 1;
    width: clamp(340px, 46vw, 700px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pathway-sign img.sign-img {
    width: 100%; height: auto;
    display: block;
    filter:
      drop-shadow(0 4px 10px rgba(0, 0, 0, 0.7))
      drop-shadow(0 22px 40px rgba(0, 0, 0, 0.65))
      drop-shadow(0 0 60px rgba(0, 0, 0, 0.5));
    pointer-events: none;
    user-select: none;
  }
  .pathway-sign-content {
    position: absolute;
    top: 63%; left: 50%;
    transform: translate(-50%, -50%);
    width: 72%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 1.6vw, 18px);
  }
  .pathway-sign-text {
    font-family: 'Cinzel', serif;
    font-weight: 800;
    font-size: clamp(12px, 1.5vw, 18px);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #2C1205;
    line-height: 1.3;
    margin: 0;
    /* .pathway-sign-content is display:flex; flex-direction:column
       with align-items:center (not stretch) -- column-direction
       flex items don't stretch to the container's cross-axis width
       by default, so this <p> was sizing itself to fit its
       UNWRAPPED text content and just centering that, never
       actually respecting the container's width. width:100% forces
       it to take the container's width so there's something for
       the text to actually wrap against. */
    width: 100%;
    min-width: 0;
    overflow-wrap: break-word;
    text-shadow:
      0 0 8px rgba(255, 210, 60, 0.9),
      0 0 16px rgba(255, 180, 20, 0.7),
      0 0 28px rgba(255, 160, 0, 0.5);
  }
  .pathway-sign-button {
    width: clamp(38px, 4vw, 52px);
    height: clamp(38px, 4vw, 52px);
    border-radius: 50%;
    background: #FCDD8B;
    color: #4A2E10;
    border: 2px solid #B8752A;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(18px, 2vw, 26px);
    text-decoration: none;
    box-shadow: 0 0 14px rgba(252, 221, 139, 0.6);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .pathway-sign-button:hover, .pathway-sign-button:focus-visible {
    transform: scale(1.12);
    box-shadow: 0 0 22px rgba(252, 221, 139, 0.9);
  }
  @media (max-width: 768px) {
    .pathway-section { flex-direction: column; justify-content: center; padding: 80px 6%; gap: 48px; }
    .pathway-sign { width: clamp(280px, 88vw, 480px); }
  }

  /* ============================================================
     FOOTER (ported from style.css, self-contained -- boxicons
     swapped for small inline SVGs so no icon font is needed)
     ============================================================ */
  #footer {
    background: #456825;
    padding: 50px 24px 30px;
    color: #fff;
    font-size: 14px;
    box-shadow: 0 -40px 50px -20px rgba(0, 0, 0, 0.5);
  }
  .footer-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
    flex-wrap: wrap;
    max-width: 1200px;
    margin: 0 auto;
  }
  .footer-left { flex: 0 0 auto; }
  .footer-favicon { width: 170px; height: auto; }
  .footer-center { flex: 1; text-align: center; min-width: 200px; }
  .footer-center-logo { max-width: 595px; width: 100%; height: auto; }
  .footer-right { flex: 0 0 auto; text-align: right; }
  .social-media-icons { margin-bottom: 15px; }
  .social-media-icons a {
    color: #fff;
    margin-left: 12px;
    transition: opacity 0.3s;
    display: inline-flex;
    vertical-align: middle;
  }
  .social-media-icons a:hover { opacity: 0.7; }
  .social-media-icons svg { width: 22px; height: 22px; fill: currentColor; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.3/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>

<script>
  // ---------- Countdown timer ----------
  const countdownDigitState = {};
  function setCountdownValue(id, value) {
    const str = String(value).padStart(2, '0');
    [str[0], str[1]].forEach((digit, i) => {
      const slotKey = `${id}-${i}`;
      if (countdownDigitState[slotKey] === digit) return;
      countdownDigitState[slotKey] = digit;
      const img = document.querySelector(`[data-slot="${slotKey}"]`);
      if (img) { img.src = `assets/img/Numbers/${digit}.png`; img.alt = digit; }
    });
  }
  function startCountdown() {
    const countdownDate = new Date("September 12, 2026 06:00:00").getTime();
    function updateCountdown() {
      const distance = countdownDate - new Date().getTime();
      let days = Math.floor(distance / 86400000);
      let hours = Math.floor((distance % 86400000) / 3600000);
      let minutes = Math.floor((distance % 3600000) / 60000);
      let seconds = Math.floor((distance % 60000) / 1000);
      if (distance < 0) { days = hours = minutes = seconds = 0; }
      setCountdownValue("days", days);
      setCountdownValue("hours", hours);
      setCountdownValue("minutes", minutes);
      setCountdownValue("seconds", seconds);
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
  }
  startCountdown();

  gsap.registerPlugin(ScrollTrigger);

  const lenis = new Lenis({ lerp: 0.15, wheelMultiplier: 1.82 });
  window.lenis = lenis;
  lenis.on('scroll', ScrollTrigger.update);
  gsap.ticker.add((time) => lenis.raf(time * 1000));
  gsap.ticker.lagSmoothing(0);

  // ---------- Forest multiplane pin sequence ----------
  (function forestMultiplane() {
    const trigger = document.getElementById('hero');
    const treeLayer = document.getElementById('forestTrees');

    // All 4 tree variants are shuffled freely across both depth
    // tiers now -- which image an instance uses no longer implies
    // its depth. Depth (farmid = smallest/furthest/fades first,
    // nearmid = bigger/closer/fades later) is controlled purely by
    // which tier it's scattered into and each tier's own CSS
    // height + GSAP timing below.
    //
    // Fixed layout (not randomized) -- same data-driven convention
    // as COMPETITIONS/PLANKS elsewhere in this codebase. Edit
    // left/height by hand here to re-tune the composition; it'll
    // be identical on every load instead of reshuffling.
    const TREES = [
      // Two dominant framing trees -- tall, near the edges, canopies
      // reach up near the logo.
      { className: 'forest-tree-nearmid', img: 'TreeOne_Mid.png',   left: 20, bottom: -6, height: 115 },
      { className: 'forest-tree-nearmid', img: 'TreeFour_Mid.png',  left: 80, bottom: -6, height: 115 },

      // Crowd, smaller/"behind" pair -- appended before the front
      // pair so they paint behind (same z-index within this tier,
      // so array/DOM order controls stacking). Pulled further out
      // toward each side instead of clustering dead-center.
      { className: 'forest-tree-farmid', img: 'TreeThree_Mid.png', left: 30, bottom: -4, height: 75 },
      { className: 'forest-tree-farmid', img: 'TreeThree_Mid.png', left: 70, bottom: -4, height: 75 },

      // Crowd, taller/"front" pair -- painted on top of the pair
      // above, noticeably taller now (95 vs 55) so the front/behind
      // depth difference actually reads. Also spaced out left/right
      // instead of sitting dead-center.
      { className: 'forest-tree-farmid', img: 'TreeThree_Mid.png', left: 40, bottom: -6, height: 95 },
      { className: 'forest-tree-farmid', img: 'TreeThree_Mid.png', left: 60, bottom: -6, height: 95 },
    ];

    TREES.forEach((t) => {
      const el = document.createElement('img');
      el.className = t.className;
      el.src = `assets/img/FOREST/${t.img}`;
      el.alt = '';
      el.loading = 'eager';
      el.style.left = `${t.left}%`;
      el.style.bottom = `${t.bottom}%`;
      el.style.height = `${t.height}vh`;
      el.style.transform = 'translateX(-50%)';
      treeLayer.appendChild(el);
    });

    // Countdown backdrop -- reuses TreeLeft/TreeRight (same big
    // corner-crop trees as the hero opening), edge-anchored like
    // they are there, so this backdrop matches the hero's scale
    // instead of using the smaller mid-tree variants.
    const leftBackdrop = document.createElement('img');
    leftBackdrop.className = 'forest-backdrop-edge forest-backdrop-edge-left';
    leftBackdrop.src = 'assets/img/FOREST/TreeLeft_NearMid.png';
    leftBackdrop.alt = '';
    leftBackdrop.loading = 'eager';
    treeLayer.appendChild(leftBackdrop);

    const rightBackdrop = document.createElement('img');
    rightBackdrop.className = 'forest-backdrop-edge forest-backdrop-edge-right';
    rightBackdrop.src = 'assets/img/FOREST/TreeRight_NearMid.png';
    rightBackdrop.alt = '';
    rightBackdrop.loading = 'eager';
    treeLayer.appendChild(rightBackdrop);

    // A few extra full-screen-height trees for more backdrop depth
    // -- appended before the two above so they paint behind
    // (TreeLeft/TreeRight stay the dominant top layer), positioned
    // toward the outer edges so they don't cover the countdown
    // boxes in the middle.
    const EXTRA_BACKDROP_TREES = [
      { img: 'TreeOne_Mid.png',  left: -2,  bottom: -10, height: 100 },
      { img: 'TreeFour_Mid.png', left: 102, bottom: -10, height: 100 },
      { img: 'TreeTwo_Mid.png',  left: 14,  bottom: -12, height: 85 },
    ];
    EXTRA_BACKDROP_TREES.forEach((t) => {
      const el = document.createElement('img');
      el.className = 'forest-backdrop-tall';
      el.src = `assets/img/FOREST/${t.img}`;
      el.alt = '';
      el.loading = 'eager';
      el.style.left = `${t.left}%`;
      el.style.bottom = `${t.bottom}%`;
      el.style.height = `${t.height}vh`;
      el.style.transform = 'translateX(-50%)';
      treeLayer.insertBefore(el, leftBackdrop);
    });


    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: trigger,
        start: 'top top',
        end: 'bottom bottom',
        scrub: 1,
        pin: '.forest-stage',
        pinSpacing: false,
      }
    });

    tl.to('#forestLogo', { opacity: 0, scale: 0.55, y: -40, duration: 1.6, ease: 'power1.in' }, 0.3);
    tl.to('.forest-bg', { scale: 1.3, duration: 4.2, ease: 'none' }, 0.2);

    tl.fromTo('.forest-tree-farmid', { scale: 1 }, { scale: 2.2, duration: 2.6, ease: 'power1.in' }, 0.2);
    tl.to('.forest-tree-farmid', { opacity: 0, duration: 0.8, ease: 'power1.in' }, 1.8);

    tl.fromTo('.forest-tree-nearmid', { scale: 1 }, { scale: 2.9, duration: 2.0, ease: 'power1.in' }, 0.4);
    tl.to('.forest-tree-nearmid', { opacity: 0, duration: 0.8, ease: 'power1.in' }, 1.4);

    // TreeLeft/TreeRight grow differently on mobile vs desktop --
    // mobile keeps the bigger scale that fixed it looking right
    // there; desktop reverts to its original, smaller scale from
    // before that mobile-specific change. Mobile also pushes them
    // further out toward the edges (bigger x movement) per request.
    const isMobileNear = window.innerWidth <= 769;
    const nearFromScale = isMobileNear ? 1.3 : 0.9;
    const nearToScale = isMobileNear ? 3.0 : 2.4;
    const nearFromX = isMobileNear ? 14 : 4;
    const nearToX = isMobileNear ? 34 : 14;

    tl.fromTo('#forestNearLeft', { scale: nearFromScale, x: `-${nearFromX}%` }, { scale: nearToScale, x: `-${nearToX}%`, duration: 2.4, ease: 'power1.in' }, 0.5);
    tl.to('#forestNearLeft', { opacity: 0, duration: 2.0 }, 3.0);

    tl.fromTo('#forestNearRight', { scale: nearFromScale, x: `${nearFromX}%` }, { scale: nearToScale, x: `${nearToX}%`, duration: 2.4, ease: 'power1.in' }, 0.8);
    tl.to('#forestNearRight', { opacity: 0, duration: 2.0 }, 3.3);

    // Backdrop trees crossfade in right as the flythrough trees
    // (farmid/nearmid, done fading by ~2.6) finish clearing out --
    // no gap where the screen goes empty before the countdown's
    // own backdrop appears. Fade out together with the countdown
    // itself so everything clears before the leaf wipe covers.
    tl.fromTo('.forest-backdrop-edge, .forest-backdrop-tall', { opacity: 0 }, { opacity: 0.9, duration: 1.6, ease: 'power1.out' }, 2.4);
    tl.to('.forest-backdrop-edge, .forest-backdrop-tall', { opacity: 0, duration: 0.6 }, 6.3);

    tl.fromTo('#forestCountdown', { opacity: 0, y: 40, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 1.0, ease: 'power2.out' }, 3.6)
      .set('#forestCountdown', { pointerEvents: 'auto' }, 3.6);

    tl.to('#forestCountdown', { opacity: 0, duration: 0.6 }, 6.4);
    tl.fromTo('#leafWipe', { yPercent: 100 }, { yPercent: 0, duration: 2.0, ease: 'power2.inOut' }, 6.6);

    // Reveal the whole stage (background, logo, near-left/right
    // trees, dynamically-created trees -- everything this timeline
    // touches) only after the page has fully loaded and
    // ScrollTrigger has refreshed with final image dimensions, not
    // right away. Revealing earlier risked showing a state that
    // then visibly shifts once the refresh recalculates pin
    // boundaries against the now-fully-loaded images. The double
    // rAF after that ensures at least one correct paint has
    // happened before the fade-in starts.
    const stageEl = document.getElementById('forestStage');
    let stageRevealed = false;
    const revealStage = () => {
      if (stageRevealed) return;
      stageRevealed = true;
      ScrollTrigger.refresh();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (stageEl) stageEl.classList.add('is-ready');
        });
      });
    };
    window.addEventListener('load', () => setTimeout(revealStage, 200));
    // Safety fallback -- don't leave the trees invisible forever if
    // window.load is ever delayed by something unrelated elsewhere
    // on the page.
    setTimeout(revealStage, 2500);
  })();

  // ---------- Mobile nav toggle ----------
  const navToggle = document.getElementById('navToggle');
  const navList = document.getElementById('navList');
  if (navToggle && navList) {
    navToggle.addEventListener('click', () => {
      const isOpen = navList.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', String(isOpen));
    });
  }

  // ---------- Header background on scroll (ported from main.js's
  // headerScrolled behavior, since main.js itself isn't loaded here) ----------
  const headerEl = document.querySelector('header');
  if (headerEl) {
    const updateHeaderScrolled = () => {
      headerEl.classList.toggle('header-scrolled', window.scrollY > 100);
    };
    window.addEventListener('scroll', updateHeaderScrolled);
    updateHeaderScrolled();
  }

  // ---------- Competitions: rock scatter ----------
  const COMPETITIONS = [
    { file: "Band",           label: "Band",                desc: "Bands bring full-stage energy, battling it out for the loudest cheer in the house.",            top: 3.3,  left: 26.3, z: 3 },
    { file: "VocalGroup",     label: "Vocal Group",         desc: "Harmonies collide as vocal ensembles take the stage together.",                                 top: 7.6,  left: 66.2, z: 2 },
    { file: "SoloSinging",    label: "Solo Singing",        desc: "One voice, one stage — solo singers go all in for the spotlight.",                              top: 13.9, left: 32.8, z: 4 },
    { file: "Monolog",        label: "Monolog",             desc: "A single performer, a single story, told with everything they've got.",                          top: 19.4, left: 64.9, z: 1 },
    { file: "MembacaPuisi",   label: "Membaca Puisi",       desc: "Poetry reading competition celebrating rhythm, emotion, and delivery.",                          top: 23.5, left: 26.3, z: 2 },
    { file: "EnglishSpeech",  label: "English Speech",      desc: "Speakers take the floor to persuade, inform, and inspire in English.",                           top: 28.2, left: 69.1, z: 3 },
    { file: "MUN",            label: "MUN",                 desc: "Model United Nations — delegates debate global issues with diplomacy and wit.",                  top: 32.9, left: 28.0, z: 2 },

  function buildRockScatter() {
    const stage = document.getElementById('rockScatter');
    if (!stage) return;
    stage.innerHTML = '';

    COMPETITIONS.forEach((comp) => {
      const rock = document.createElement('button');
      rock.className = 'rock';
      rock.type = 'button';
      rock.setAttribute('aria-label', comp.label);

      rock.style.top = `${comp.top}%`;
      rock.style.left = `${comp.left}%`;
      rock.style.zIndex = String(comp.z);

      const img = document.createElement('img');
      img.src = `assets/img/Stone/${comp.file}.png`;
      img.alt = comp.label;
      img.loading = 'lazy';

      const label = document.createElement('span');
      label.className = 'rock-label';
      label.textContent = comp.label;

      rock.appendChild(img);
      rock.appendChild(label);
      stage.appendChild(rock);

      // Click a stone to open its info in the shared overlay --
      // same pattern as the calendar page's plank detail popup.
      rock.addEventListener('click', () => openRockDetail(comp));
    });
  }

  function openRockDetail(comp) {
    document.getElementById('rockDetailTitle').textContent = comp.label;
    document.getElementById('rockDetailDesc').textContent = comp.desc || '';
    document.getElementById('rockOverlay').classList.add('active');
  }

  function closeRockDetail() {
    document.getElementById('rockOverlay').classList.remove('active');
  }

  buildRockScatter();

  document.getElementById('rockClose')?.addEventListener('click', closeRockDetail);
  document.getElementById('rockOverlay')?.addEventListener('click', (e) => {
    if (e.target.id === 'rockOverlay') closeRockDetail();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeRockDetail();
  });
</script>
